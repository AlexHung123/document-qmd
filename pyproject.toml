[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dochub"
version = "0.1.0"
description = "Mac file and index hub. The frontend authenticates users and forwards X-User-Id; this service stores originals, converts Markdown, and searches each user's QMD index."
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
dochub = "dochub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
